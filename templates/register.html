{% from "bootstrap5/form.html" import render_form %} {% block content %} {%
include "header.html" %}

<!-- Page Header -->
<header
  class="masthead"
  style="background-image: url('../static/assets/img/register-bg.jpg')"
>
  <div class="container position-relative px-4 px-lg-5">
    <div class="row gx-4 gx-lg-5 justify-content-center">
      <div class="col-md-10 col-lg-8 col-xl-7">
        <div class="page-heading">
          <h1>Register</h1>
          <span class="subheading">Start Contributing to the Blog!</span>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="mb-4">
  <div class="container">
    <div class="row">
      <div class="col-lg-8 col-md-10 mx-auto">
          <form action="{{ url_for('register') }}" method="post">
            <div class="mb-3">
              <input type="text" name="name" placeholder="Name" required class="form-control" />
            </div>
            <div class="mb-3">
              <input type="email" name="email" placeholder="Email" required class="form-control" />
            </div>
            <div class="mb-3">
              <input type="password" name="password" placeholder="Password" required class="form-control" />
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign me up.</button>
          </form>
      </div>
    </div>
  </div>
</main>

{% include "footer.html" %} {% endblock %}
